<style>body{margin:0;padding:0;background:#000}#loading-text{color:#fff;font-family:sans-serif;text-align:center;margin-top:20px}#unity-canvas{position:fixed;top:0;left:0;width:100%;height:100%;outline:none}</style>
</head>
<body>
<div id="loading-text">LOADING...</div>
<canvas id="unity-canvas"></canvas>
<script>
const SPLIT_MAP={'e43146de2c43eba2975b147238c70d24.wasm':null,'9376974b142b246eab3291faedddc9eb.data':null};
async function mergeParts(baseUrl){const parts=[];for(let i=1;i<=99;i++){const u=baseUrl+'.part'+i;try{const h=await fetch(u,{method:'HEAD'});if(!h.ok)break;parts.push(u)}catch{break}}if(!parts.length)return baseUrl;const buffers=await Promise.all(parts.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error('Failed part '+u);return new Uint8Array(await r.arrayBuffer())}));const total=buffers.reduce((a,b)=>a+b.length,0);const merged=new Uint8Array(total);let off=0;for(const b of buffers){merged.set(b,off);off+=b.length}return URL.createObjectURL(new Blob([merged]))}
async function preMergeAll(){const map={};const files=Object.entries(SPLIT_MAP);const total=files.length;let done=0;const t=document.getElementById('loading-text');for(const [file] of files){map[file]=await mergeParts('Build/'+file);done++;t.innerText='LOADING... '+Math.floor(done/total*100)+'%'}t.style.display='none';return map}
(async()=>{const mergedMap=await preMergeAll();const origFetch=window.fetch;window.fetch=async function(resource,options){if(typeof resource==='string'){const key=resource.split('/').pop();if(mergedMap[key])return origFetch(mergedMap[key],options);if(resource.includes('StreamingAssets')){const b=document.querySelector('base');return origFetch((b?b.href:'')+'StreamingAssets/'+resource.split('/StreamingAssets/')[1])}}return origFetch(resource,options)};const canvas=document.querySelector('#unity-canvas');const config={dataUrl:'Build/9376974b142b246eab3291faedddc9eb.data',frameworkUrl:'Build/4c5c5033ffe7f867960cf91d945081f5.js',codeUrl:'Build/e43146de2c43eba2975b147238c70d24.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Jungle Deer Hunting',productName:'Jungle Deer Hunting',productVersion:'1.0.0'};const script=document.createElement('script');script.src='Build/e9dadf13d3d2ec49cc33413f986a95cb.js';script.onload=()=>{createUnityInstance(canvas,config,()=>{}).then(i=>window.gameInstance=i).catch(m=>alert(m))};document.body.appendChild(script)})();
function resizeCanvas(){const c=document.getElementById('unity-canvas');c.width=innerWidth;c.height=innerHeight}
addEventListener('load',resizeCanvas);addEventListener('resize',resizeCanvas);
</script>
</body>
